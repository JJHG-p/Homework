<div class="auth-card">
    <h2>Registro</h2>

    <input
        class="form-control"
        type="email"
        placeholder="Correo"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
    />
    <input
        class="form-control"
        type="password"
        placeholder="Contraseña"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
    />

    <button class="btn btn-success w-100" (click)="handleRegister()">Crear cuenta</button>

    <p class="mt-3">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
