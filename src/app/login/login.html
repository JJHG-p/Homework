<div class="auth-card">
    <h2>Login</h2>

    <input type="email"
           class="form-control"
           placeholder="Email"
           [ngModel]="email()"
           (ngModelChange)="email.set($event)"/>

    <input
           type="password"
           class="form-control"
           placeholder="Password"
           [ngModel]="password()"
           (ngModelChange)="password.set($event)"/>

    <button type="button" class="btn btn-primary" (click)="handleLogin()">Login</button>

    <p class="cambio">¿No tienes cuenta? <a routerLink="/register">Regístrarte</a>
    </p>
</div>
