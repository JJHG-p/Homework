<div class="auth-card">
    
    <h2>Iniciar sesión</h2>

    <input
        class="form-control"
        type="email"
        placeholder="Correo"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
    />
    <input
        class="form-control"
        type="password"
        placeholder="Contraseña"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
    />

    <button class="btn btn-primary w-100" (click)="handleLogin()">Entrar</button>

    <p class="mt-3">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
