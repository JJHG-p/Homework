<nav>
  @if (auth.estaLogueado()) {
    <span class="usuario">Hola, {{ auth.usuario() }}</span>
    <a routerLink="/explorador" routerLinkActive="activo">Explorador</a>
    <button class="btn btn-outline-light btn-sm" (click)="salir()">Cerrar sesión</button>
  } @else {
    <span class="usuario">Explorador de archivos</span>
    <a routerLink="/login" routerLinkActive="activo">Login</a>
    <a routerLink="/register" routerLinkActive="activo">Registro</a>
  }
</nav>

<router-outlet />
