<main class="contenedor">
  <h1>Buscador de GIFs</h1>

  <div class="barra">
    <input
      type="text"
      placeholder="Escribe algo, por ejemplo: smile"
      [ngModel]="texto()"
      (ngModelChange)="actualizarTexto($event)"
      (keyup.enter)="buscar()"
    />
    <button (click)="buscar()">Buscar</button>
  </div>

  @if (giphy.cargando()) {
    <p class="mensaje">Cargando...</p>
  }

  @if (giphy.error()) {
    <p class="mensaje error">{{ giphy.error() }}</p>
  }

  @if (buscado() && !giphy.cargando() && !giphy.error() && giphy.gifs().length === 0) {
    <p class="mensaje">No se encontraron GIFs.</p>
  }

  <section class="galeria">
    @for (gif of giphy.gifs(); track gif.id) {
      <img [src]="gif.images.fixed_height.url" [alt]="gif.title" />
    }
  </section>
</main>
