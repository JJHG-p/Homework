<nav>
  @if (auth.session()) {
    <span class="usuario">{{ auth.session()?.user?.email }}</span>
    <a routerLink="/tareas">Tareas</a>
    <a routerLink="/perfil">Perfil</a>
    <button (click)="salir()">Cerrar sesión</button>
  } @else {
    <span class="usuario">Tareas con Supabase</span>
    <a routerLink="/login">Login</a>
  }
</nav>
