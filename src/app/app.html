<nav>
  @if (auth.estaLogueado()) {
    <span class="usuario">Hola, {{ auth.usuario() }}</span>
    <a routerLink="/tareas">Tareas</a>
    <a routerLink="/arbol">Árbol binario</a>
    <a routerLink="/menu">Menú lateral</a>
    <button class="btn btn-outline-light btn-sm" (click)="salir()">Cerrar sesión</button>
  } @else {
    <span class="usuario">Tareas con Firebase</span>
    <a routerLink="/login">Login</a>
    <a routerLink="/register">Registro</a>
  }
</nav>

<router-outlet />
