<h1>Registro de Estudiantes</h1>

<input placeholder="Nombre" (change)="captureName($event)" />
<input placeholder="Edad" (change)="captureAge($event)" />
<input placeholder="Código" (change)="captureCode($event)" />
<button (click)="addStudent()">Agregar Estudiante</button>

<app-student-list
  [students]="students()"
  (removeStudent)="removeStudent($event)"
></app-student-list>
