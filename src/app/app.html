<div class="sidebar">
  @for (item of menu; track item.valor.title) {
    <app-menu-item [nodo]="item" [seleccionado]="seleccionado"></app-menu-item>
  }
</div>
<h1>Árbol binario</h1>

<div>
  <input #buscarInput type="number" placeholder="Número a buscar">
  <button (click)="buscarNumero(buscarInput.value)">Buscar</button>
  <p>{{ resultadoBusqueda() }}</p>
</div>

<button (click)="dibujarArbol()">Dibujar árbol</button>

<div id="arbol"></div>
